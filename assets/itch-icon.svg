<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.6" fill="#1D1A38"/>
    </pattern>
    <!-- The floppy from the website, 64-unit grid. -->
    <g id="disk">
      <path d="M6 4h46l8 8v44a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4z" fill="#FF6A55"/>
      <rect x="16" y="4" width="30" height="20" rx="1.5" fill="#C9CCD8"/>
      <circle cx="25" cy="14" r="5" fill="#1D1A3F"/>
      <path d="M29 12.5h12v3h-2v3h-3v-3h-2v2h-3v-2h-2z" fill="#1D1A3F"/>
      <rect x="11" y="32" width="42" height="24" rx="2" fill="#FFFDF6"/>
      <rect x="15" y="38" width="34" height="2" rx="1" fill="#C9C3E3"/>
      <rect x="15" y="44" width="34" height="2" rx="1" fill="#C9C3E3"/>
      <rect x="15" y="50" width="22" height="2" rx="1" fill="#C9C3E3"/>
    </g>
    <path id="outline" d="M6 4h46l8 8v44a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4z"/>
  </defs>
  <rect width="512" height="512" fill="#100E22"/>
  <rect width="512" height="512" fill="url(#dots)"/>
  <!-- Disk: 266 px wide, centered, with the hard lilac shadow of the site. -->
  <g transform="translate(100 100) scale(4.75)">
    <use href="#outline" transform="translate(1.6 1.6)" fill="#CFC9F2"/>
    <use href="#disk"/>
  </g>
</svg>
